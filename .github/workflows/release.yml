name: Release

# Deploys the site Worker when a version tag lands — after the check suite
# AND the e2e suite (e2e.yml's job, run again here directly so a deploy is
# gated on it even if the tagged diff didn't touch e2e.yml's watched paths),
# with a fresh crawl baked into the release build. The flow is:
# `npm version <patch|minor|major>` locally, then `git push --follow-tags` —
# this workflow does the rest.
#
# The deploy needs the CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo
# secrets ("Edit Cloudflare Workers" token template), same as ntnu-mcp.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      # FIRST, not after the checks. `data/*.json` are gitignored crawl
      # artifacts, so a release runner starts without them — and `astro check`
      # and the unit suite both IMPORT them (`data/semesters.json`,
      # `data/programs.json`). Crawling after the checks meant every release
      # died at typecheck with nine "Cannot find module '../../../data/…'"
      # errors, on a runner where the only fix is to have fetched them already.
      # `ci.yml` had this right; this file did not, and nothing caught it
      # because a release had never been run.
      #
      # No cache key here, unlike ci.yml and e2e.yml: a DEPLOY bakes this data
      # into the artifact students read, so it is crawled fresh every time
      # rather than restored from whatever the first job of the day fetched.
      # `prebuild` sees the files present and skips its own crawl, so the build
      # below ships exactly what was fetched here.
      - name: Crawl fresh data for the release build
        run: npm run crawl
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: End-to-end suite against live data (REVIEW.md T1 — gates every deploy)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - run: npm run build
      - name: Deploy Worker to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: GitHub Release with generated notes
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
