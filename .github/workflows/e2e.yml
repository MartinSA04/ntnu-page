name: E2E

# The only end-to-end test of PRODUCT.md §0 (programme + kull → your week,
# instantly) against real, live NTNU data. `ci.yml`'s unit pass cannot see
# this — it structurally excludes `*.pw.ts` (mise run check is a fast,
# server-free run) — so this ran nowhere until now, which is how B2/B4-class
# regressions (REVIEW.md T1) reached a build with a green badge.
#
# Scoped to the paths where a regression is plausible, plus a nightly run:
# live upstream data drifts (a programme's plan reshapes, a timetable
# publishes) independently of any commit here, and only a schedule catches
# that. `release.yml` also runs this suite directly before every deploy, so
# a tag push is gated even if the triggering diff missed these paths.
#
# The filter used to be five globs under src/lib/planner, src/components/planner
# and worker — which missed BOTH files CLAUDE.md names load-bearing:
# `src/layouts/Layout.astro`'s `astro:after-swap` re-apply and
# `src/lib/pageLifecycle.ts`'s `onPage()`. navigation.pw.ts exists to guard
# exactly those two, no unit test touches either, and HEAD~1 edited Layout's
# script and triggered nothing (tests-1). `src/**` is now the glob: the suite
# drives whole pages, so every page, layout, component and stylesheet is a path
# it protects. Do not narrow this back without checking, per CLAUDE.md, that
# the flagship flow cannot regress through a path that is no longer watched.

on:
  pull_request:
    paths:
      - "src/**"
      - "worker/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "astro.config.mjs"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "worker/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "astro.config.mjs"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "17 5 * * *" # off-hour, offset from crawl.yml's 03:47 and ntnu-api's 05:17
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # Today's key ONLY — no `restore-keys` prefix. With one, a prefix hit
      # restored yesterday's bytes, `ensure-data.mjs` saw four present files and
      # skipped the crawl, and actions/cache re-saved the same bytes under
      # today's key: by induction the artifacts froze at the first cold run and
      # this job never crawled again, which is precisely what the nightly cron
      # exists to do (tests-5). Missing the key is the point — it is what makes
      # the crawl run. Same key as ci.yml, so the first job of the day pays for
      # it and the rest hit exactly.
      - name: Restore crawl artifacts (today's crawl, or none)
        uses: actions/cache@v4
        with:
          path: |
            data
            public/data
          key: crawl-data-${{ steps.date.outputs.today }}
      - run: npm ci
      - name: Ensure crawl artifacts (crawls only on a cold cache)
        run: node crawler/ensure-data.mjs
      - run: npx playwright install --with-deps chromium
      # Push and PR runs replay `e2e/fixtures/` — deterministic, and an NTNU
      # outage cannot red a build about a CSS change. The scheduled run goes to
      # live upstream instead and additionally runs `contract.pw.ts`, which is
      # what actually notices that the data moved: a plan reshaping or a lecture
      # being rescheduled happens independently of any commit here, so only the
      # schedule can catch it. Keep both — the fixtures are a copy of yesterday's
      # upstream, and nothing but a live run can tell you when they stopped
      # being true.
      - name: E2E (replay fixtures)
        if: github.event_name != 'schedule'
        run: npm run test:e2e
      - name: E2E (live upstream + contract)
        if: github.event_name == 'schedule'
        run: npm run e2e:live
