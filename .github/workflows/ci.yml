name: CI

# Lint + typecheck + tests + a build smoke on every push and PR. Deploys are
# tag-driven through the release workflow; the crawl workflow refreshes data
# nightly. Checks need crawl artifacts on disk (pages and `astro check` import
# the JSON), so a date-keyed cache keeps CI at zero-to-one real crawls per day
# — stale data is perfectly fine for checks, and the upstream stays untouched.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore crawl artifacts (any recent day is fine for CI)
        uses: actions/cache@v4
        with:
          path: |
            data
            public/data
          key: crawl-data-${{ steps.date.outputs.today }}
          restore-keys: crawl-data-
      - run: npm ci
      - name: Ensure crawl artifacts (crawls only on a cold cache)
        run: node crawler/ensure-data.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
