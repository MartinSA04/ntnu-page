name: CI

# Lint + typecheck + tests + a build smoke on every push and PR. Deploys are
# tag-driven through the release workflow; the crawl workflow refreshes data
# nightly. Checks need crawl artifacts on disk (pages and `astro check` import
# the JSON), so a date-keyed cache keeps CI at zero-to-one real crawls per day
# — stale data is perfectly fine for checks, and the upstream stays untouched.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # Today's key ONLY — the `restore-keys: crawl-data-` prefix that used to
      # sit here made the comment above false: a prefix hit restored yesterday's
      # artifacts, `ensure-data.mjs` skipped the crawl because the files existed,
      # and the same bytes were re-saved under today's key, so after the first
      # cold run CI never crawled again (tests-5). e2e.yml uses the same key, so
      # whichever job runs first that day pays for the crawl.
      - name: Restore crawl artifacts (today's crawl, or none)
        uses: actions/cache@v4
        with:
          path: |
            data
            public/data
          key: crawl-data-${{ steps.date.outputs.today }}
      - run: npm ci
      - name: Ensure crawl artifacts (crawls only on a cold cache)
        run: node crawler/ensure-data.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
